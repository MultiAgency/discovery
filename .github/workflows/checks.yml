name: checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install script check dependencies
        run: sudo apt-get update && sudo apt-get install --yes jq shellcheck
      - name: Check shell scripts
        run: shellcheck -x scripts/*.sh scripts/synthetic/*.sh
      - name: Test transaction recovery offline
        run: scripts/test-smoke.sh
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: checks-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --release --locked --target wasm32-wasip2 -p discovery-module
