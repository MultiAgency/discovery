name: checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install script check dependencies
        run: sudo apt-get update && sudo apt-get install --yes jq
      # The same shellcheck as local development, so rule codes agree.
      - name: Install shellcheck 0.11.0
        run: |
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz" | sha256sum --check
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version
      - name: Check shell scripts
        run: shellcheck -x scripts/*.sh
      - name: Test transaction recovery offline
        run: scripts/test-smoke.sh
      - name: Test invitation checkout checks offline
        run: scripts/test-invitation.sh
      - name: Test demo launcher offline
        run: scripts/test-demo.sh
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: checks-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --release --locked --target wasm32-wasip2 -p discovery-module
