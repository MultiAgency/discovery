[workspace]
resolver = "2"
members = ["crates/protocol", "crates/module", "crates/cli"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hkdf = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
getrandom = "0.3"
hex = "0.4"
base64 = "0.22"
outlayer = { version = "0.2.1", features = ["encryption-keys"] }
discovery-protocol = { path = "crates/protocol" }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
