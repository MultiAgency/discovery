[package]
name = "discovery-spike"
version = "0.1.0"
edition = "2021"
publish = false
description = "Throwaway OutLayer module that verifies the D5/D6/D10 platform assumptions on testnet"

[[bin]]
name = "discovery-spike"
path = "src/main.rs"

[dependencies]
outlayer = { version = "0.2.1", features = ["encryption-keys"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
base64 = "0.22"
bs58 = "0.5"
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
getrandom = "0.3"

[profile.release]
opt-level = "z"
lto = true
strip = true
