[package]
name = "discovery-nearai"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "NEAR AI Cloud, verified: attestation, E2EE v2, signed responses, receipts (vendored from MultiAgency/private-ai@dd469a5)"

[dependencies]
anyhow = "1"
asn1_der = { version = "0.7", default-features = false, features = ["native_types"] }
base64.workspace = true
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
dcap-qvl = { version = "0.6.5", default-features = false, features = ["std", "rustcrypto", "default-x509"] }
ed25519-dalek = { version = "2", default-features = false }
getrandom.workspace = true
hex.workspace = true
hkdf.workspace = true
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
pem = { version = "3", default-features = false }
serde.workspace = true
serde_json = { version = "1", features = ["preserve_order"] }
sha2.workspace = true
wasip2 = "2"
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }

