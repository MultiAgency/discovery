[package]
name = "discovery-module"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "OutLayer WASI module: InitSurvey, Submit, Status, Finalize"

[[bin]]
name = "discovery-module"
path = "src/main.rs"

[dependencies]
discovery-protocol.workspace = true
outlayer.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
base64.workspace = true
anyhow = "1"
asn1_der = { version = "0.7", default-features = false, features = ["native_types"] }
chacha20poly1305.workspace = true
dcap-qvl = { version = "0.6.5", default-features = false, features = ["std", "rustcrypto", "default-x509"] }
ed25519-dalek = { version = "2", default-features = false }
hkdf.workspace = true
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
pem = { version = "3", default-features = false }
sha2.workspace = true
wasip2 = "2"
x25519-dalek.workspace = true
